// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

// Configure Java toolchain usage for subprojects/tasks that require a Java compiler.
// This requests Java 21 and — combined with org.gradle.java.installations.auto-download=true
// in gradle.properties — allows Gradle to download a matching JDK if the host JDK differs.
subprojects {
    // Ensure repositories are available for toolchain downloads
    repositories {
        google()
        mavenCentral()
    }

    // Configure toolchain for JavaCompile tasks where available
    tasks.withType(JavaCompile).configureEach {
        javaCompiler = javaToolchains.compilerFor {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    // If Kotlin is present, set its jvmTarget to 21
    afterEvaluate { proj ->
        proj.plugins.withId('org.jetbrains.kotlin.jvm') {
            proj.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions.jvmTarget = '21'
            }
        }
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
