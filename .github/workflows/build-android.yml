name: Build Android APK

on:
  push:
    branches:
      - '**'   # Toutes les branches — rebuild APK à chaque push
  workflow_dispatch:  # Lancement manuel depuis GitHub

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Installer Java 17 (requis par Gradle/Android)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Installer les dépendances npm
      - name: Install dependencies
        run: npm install

      # 5. Build React (Vite)
      - name: Build React app
        run: npm run build
        env:
          # Injectez ici vos variables d'environnement Firebase
          # Configurez-les dans GitHub → Settings → Secrets → Actions
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}


      # 6. Ajouter la plateforme Android (si pas déjà dans le repo)
      - name: Add Android platform
        run: npx cap add android
        continue-on-error: true  # Ignore l'erreur si android/ existe déjà

      # 8. Synchroniser le build Vite vers Android
      - name: Sync Capacitor → Android
        run: npx cap sync android

      # 9. Donner les droits d'exécution à Gradle
      - name: Grant execute permission to Gradlew
        run: chmod +x android/gradlew

      # 10. Compiler l'APK debug
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # 11. Uploader l'APK comme artifact téléchargeable
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flash-pay-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30  # L'APK est disponible 30 jours
