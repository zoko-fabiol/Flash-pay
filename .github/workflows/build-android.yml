name: Build Android APKs

on:
  push:
    branches:
      - '**'   # Rebuild APKs on every push
  workflow_dispatch:  # Manual trigger

jobs:
  build-platform:
    name: Build Platform APK
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Sync Capacitor → Android
        run: npx cap sync android

      - name: Grant execute permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Platform APK
        uses: actions/upload-artifact@v4
        with:
          name: flash-pay-platform-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  build-admin:
    name: Build Admin APK
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Admin dependencies
        working-directory: "Flash Pay admin"
        run: npm install

      - name: Build Admin React app
        working-directory: "Flash Pay admin"
        run: npm run build

      - name: Sync Admin Capacitor → Android
        working-directory: "Flash Pay admin"
        run: npx cap sync android

      - name: Grant execute permission to Gradlew
        working-directory: "Flash Pay admin/android"
        run: chmod +x gradlew

      - name: Build Admin Debug APK
        working-directory: "Flash Pay admin/android"
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: flash-pay-admin-debug
          path: Flash Pay admin/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
